name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Unit Tests, Screenshots & APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (API 37 & 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;37.0.0 build-tools;36.1.0 platforms;android-37.0 platforms;android-36'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and verify Roborazzi screenshots
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug and Release APKs
        env:
          HALATUJU_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && '/tmp/halatuju-release.jks' || '' }}
          HALATUJU_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HALATUJU_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HALATUJU_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/halatuju-release.jks
          fi
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: halatuju-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/lint-results*
            **/build/reports/tests/

  emulator-tests:
    name: Emulator Tests (API ${{ matrix.api-level }})
    needs: [ build-and-test ]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 36, 34 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (API 37 & 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;37.0.0 build-tools;36.1.0 platforms;android-37.0 platforms;android-36'

      - name: Configure KVM access for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          sudo usermod -aG kvm "$USER" || true
          ls -la /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Restore Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests on KVM emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4000M
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: false
          script: bash ./scripts/ci-run-emulator-tests.sh "${{ matrix.api-level }}"

      - name: Upload emulator test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ci-emulator-artifacts/

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-and-test, emulator-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: halatuju-apks
          path: dist-apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-apks/**/*.apk
