# Project-wide Gradle settings (machine-specific proxy/SDK settings belong in ~/.gradle/gradle.properties and local.properties)
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Prevent Gradle 9 Roborazzi multi-variant task race (#830)
roborazzi.output.dir=src/test/snapshots
